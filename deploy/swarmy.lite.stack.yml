# swarmy control plane: one service, one volume. The controller's store is
# embedded SQLite (control.db + telemetry.db in SWARMY_DATA_DIR on swarmy-data).
#
# Deployed by scripts/install-swarmy.sh on the bootstrap host via:
#   docker stack deploy -c deploy/swarmy.lite.stack.yml swarmy
#
# ${VARS} are interpolated by `docker stack deploy` from the installer's environment.
# Secrets are external (created by the installer with `docker secret create`) and
# surfaced to the container as *_FILE, which docker-entrypoint.sh expands into env —
# so no secret ever lands in the service spec or `docker inspect`.
version: "3.8"

# Bounded container logs for the control plane (node disks must never fill).
# Every service swarmy itself deploys gets the same default (core
# DEFAULT_LOG_DRIVER); the installer also sets daemon-level log-opts.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  controller:
    logging: *logging
    image: ${SWARMY_IMAGE}
    # Stable service DNS name on swarmy-control: the node-#1 agent, Caddy, and the
    # cloudflared connector all reach the controller at swarmy_controller:3021.
    hostname: swarmy_controller
    environment:
      NODE_ENV: production
      PORT: "3021"
      SWARMY_DATA_DIR: /var/lib/swarmy/data
      SWARMY_STATIC_DIR: /app/public
      SWARMY_BOOTSTRAP: "1"
      CONTROLLER_PUBLIC_URL: ${SWARMY_PUBLIC_URL}
      BETTER_AUTH_URL: ${SWARMY_PUBLIC_URL}
      # https dashboard (public-IP installs default to swarmy.<ip-dashed>.sslip.io):
      # the bootstrap seed binds it to the org edge, which serves a `dashboard`
      # controller vhost for it. Empty = no https vhost (behind NAT / --no-https).
      SWARMY_DASHBOARD_DOMAIN: ${SWARMY_DASHBOARD_DOMAIN:-}
      # The direct host-mode origin (http://<ip>:<port>). Stays a trusted auth
      # origin next to the https URL so the pre-cert first login still works.
      SWARMY_DIRECT_URL: ${SWARMY_DIRECT_URL:-}
      # The swarmy-control overlay subnet when Caddy fronts the dashboard, so the client IP
      # (auth rate limits, sessions) comes from X-Forwarded-For, not Caddy's address.
      SWARMY_TRUSTED_PROXIES: ${SWARMY_TRUSTED_PROXIES:-}
      ADMIN_EMAIL: ${SWARMY_ADMIN_EMAIL}
      # Username login for the first owner when there is no email (optional).
      ADMIN_USERNAME: ${SWARMY_ADMIN_USERNAME:-}
      # Registration: unset/empty = invite-only (production default); "true" = open sign-up.
      SWARMY_ALLOW_SIGNUP: ${SWARMY_ALLOW_SIGNUP:-}
      # Non-secret swarm identity; the join tokens themselves arrive as secrets below.
      SWARM_ID: ${SWARMY_SWARM_ID}
      SWARM_MANAGER_ADDR: ${SWARMY_MANAGER_ADDR}
      # Mesh (opt-in): empty driver/url are no-ops — ensureMeshConfig skips when unset.
      SWARMY_MESH_DRIVER: ${SWARMY_MESH_DRIVER:-}
      SWARMY_MESH_MANAGEMENT_URL: ${SWARMY_MESH_MANAGEMENT_URL:-}
      # Docker-secret file references (expanded by the entrypoint).
      SWARMY_SECRET_KEY_FILE: /run/secrets/swarmy_secret_key
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SWARMY_BOOTSTRAP_JOIN_TOKEN_FILE: /run/secrets/bootstrap_join_token
      SWARM_WORKER_TOKEN_FILE: /run/secrets/swarm_worker_token
      SWARM_MANAGER_TOKEN_FILE: /run/secrets/swarm_manager_token
      SWARMY_MESH_SERVICE_TOKEN_FILE: /run/secrets/mesh_service_token
    secrets:
      - swarmy_secret_key
      - better_auth_secret
      - admin_password
      - bootstrap_join_token
      - swarm_worker_token
      - swarm_manager_token
      - mesh_service_token
    volumes:
      - swarmy-data:/var/lib/swarmy
    ports:
      # Host-mode publish so first login works at http://<host-ip>:<port> before
      # ingress exists. Pinned to the bootstrap host by the placement constraint.
      - target: 3021
        published: ${SWARMY_PUBLISH_PORT}
        protocol: tcp
        mode: host
    networks:
      # PRIVATE control-plane overlay only. Never the shared `swarmy` network:
      # every routed/observed app joins that one, and an app there could reach
      # (or alias-impersonate) the controller.
      - swarmy-control
    deploy:
      # The control plane is platform plumbing, not a user app stack.
      labels:
        swarmy.system: "true"
      replicas: 1
      placement:
        constraints:
          # Pin to the bootstrap host: the store's volume is node-local, so a floating
          # task on another node would mount an empty DB. node.hostname, not node.role.
          - node.hostname == ${SWARMY_NODE_HOSTNAME}
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3021/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  # swarmy's PRIVATE control-plane overlay: the controller, ClickHouse, and the trusted bridges that must reach them
  # (edge Caddy's dashboard vhost, cloudflared, the OTel collector, the node-#1
  # agent). User services never join it — swarmy's admission refuses it, and
  # compose→stack rejects it. External + literally named so docker stack
  # doesn't prefix it. The installer creates it (encrypted; MTU sized for the
  # mesh when the swarm rides one) before deploying this file.
  #
  # The shared `swarmy` overlay (edge ↔ routed apps, OTel collector, Garage)
  # is deliberately NOT attached here.
  swarmy-control:
    external: true
    name: swarmy-control

volumes:
  swarmy-data:

secrets:
  swarmy_secret_key:
    external: true
  better_auth_secret:
    external: true
  admin_password:
    external: true
  bootstrap_join_token:
    external: true
  swarm_worker_token:
    external: true
  swarm_manager_token:
    external: true
  mesh_service_token:
    external: true
