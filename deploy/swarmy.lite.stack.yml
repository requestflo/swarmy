# swarmy control plane: one service, one volume. The controller's store is
# embedded SQLite (control.db + telemetry.db in SWARMY_DATA_DIR on swarmy-data).
#
# Deployed by scripts/install-swarmy.sh on the bootstrap host via:
#   docker stack deploy -c deploy/swarmy.lite.stack.yml swarmy
#
# ${VARS} are interpolated by `docker stack deploy` from the installer's environment.
# Secrets are external (created by the installer with `docker secret create`) and
# surfaced to the container as *_FILE, which docker-entrypoint.sh expands into env —
# so no secret ever lands in the service spec or `docker inspect`.
version: "3.8"

# Bounded container logs for the control plane (node disks must never fill).
# Every service swarmy itself deploys gets the same default (core
# DEFAULT_LOG_DRIVER); the installer also sets daemon-level log-opts.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  controller:
    logging: *logging
    image: ${SWARMY_IMAGE}
    # Stable service DNS name on swarmy-control: the node-#1 agent, Caddy, and the
    # cloudflared connector all reach the controller at swarmy_controller:3021.
    hostname: swarmy_controller
    environment:
      NODE_ENV: production
      PORT: "3021"
      SWARMY_DATA_DIR: /var/lib/swarmy/data
      SWARMY_STATIC_DIR: /app/public
      SWARMY_BOOTSTRAP: "1"
      CONTROLLER_PUBLIC_URL: ${SWARMY_PUBLIC_URL}
      BETTER_AUTH_URL: ${SWARMY_PUBLIC_URL}
      # https dashboard (public-IP installs default to swarmy.<ip-dashed>.sslip.io):
      # the bootstrap seed binds it to the org edge, which serves a `dashboard`
      # controller vhost for it. Empty = no https vhost (behind NAT / --no-https).
      SWARMY_DASHBOARD_DOMAIN: ${SWARMY_DASHBOARD_DOMAIN:-}
      # The direct host-mode origin (http://<ip>:<port>). Stays a trusted auth
      # origin next to the https URL so the pre-cert first login still works.
      SWARMY_DIRECT_URL: ${SWARMY_DIRECT_URL:-}
      # Every address this host answers on (installer-detected): each is a trusted
      # sign-in origin, so a multi-homed host signs in from any of them (not only
      # SWARMY_DIRECT_URL). Live node IPs are added at runtime from the hub.
      SWARMY_DIRECT_HOSTS: ${SWARMY_DIRECT_HOSTS:-}
      # The swarmy-control overlay subnet when Caddy fronts the dashboard, so the client IP
      # (auth rate limits, sessions) comes from X-Forwarded-For, not Caddy's address.
      SWARMY_TRUSTED_PROXIES: ${SWARMY_TRUSTED_PROXIES:-}
      ADMIN_EMAIL: ${SWARMY_ADMIN_EMAIL}
      # Username login for the first owner when there is no email (optional).
      ADMIN_USERNAME: ${SWARMY_ADMIN_USERNAME:-}
      # Registration: unset/empty = invite-only (production default); "true" = open sign-up.
      SWARMY_ALLOW_SIGNUP: ${SWARMY_ALLOW_SIGNUP:-}
      # Platform upgrades (installer --release-pubkey / --platform-feed-url). Empty =
      # the built-in release key and the GitHub releases feed. The key is the PEM
      # itself (multi-line is fine: the stack loader interpolates after YAML parsing).
      SWARMY_RELEASE_PUBKEY: ${SWARMY_RELEASE_PUBKEY:-}
      SWARMY_PLATFORM_FEED_URL: ${SWARMY_PLATFORM_FEED_URL:-}
      # H17: node installs are HTTPS-only; "1" (installer --allow-insecure-install)
      # also serves them over plain HTTP when there is no HTTPS address.
      SWARMY_ALLOW_INSECURE_INSTALL: ${SWARMY_ALLOW_INSECURE_INSTALL:-}
      # Non-secret swarm identity; the join tokens themselves arrive as secrets below.
      SWARM_ID: ${SWARMY_SWARM_ID}
      SWARM_MANAGER_ADDR: ${SWARMY_MANAGER_ADDR}
      # Mesh (opt-in): empty driver/url are no-ops — ensureMeshConfig skips when unset.
      SWARMY_MESH_DRIVER: ${SWARMY_MESH_DRIVER:-}
      SWARMY_MESH_MANAGEMENT_URL: ${SWARMY_MESH_MANAGEMENT_URL:-}
      # --mesh swarmy: NetBird runs inside swarmy (swarmy-mesh-control on node #1).
      SWARMY_MESH_MODE: ${SWARMY_MESH_MODE:-}
      SWARMY_MESH_DOMAIN: ${SWARMY_MESH_DOMAIN:-}
      SWARMY_MESH_TLS: ${SWARMY_MESH_TLS:-}
      SWARMY_MESH_CLUSTER: ${SWARMY_MESH_CLUSTER:-}
      SWARMY_MESH_CONTROL_HOSTNAME: ${SWARMY_MESH_CONTROL_HOSTNAME:-}
      # Behind the edge: NetBird's plain listener on the control-plane node's
      # docker0, tried first by the controller (falls back to the public URL).
      SWARMY_MESH_ADMIN_URL: ${SWARMY_MESH_ADMIN_URL:-}
      # Docker-secret file references (expanded by the entrypoint).
      SWARMY_SECRET_KEY_FILE: /run/secrets/swarmy_secret_key
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SWARMY_BOOTSTRAP_JOIN_TOKEN_FILE: /run/secrets/bootstrap_join_token
      SWARM_WORKER_TOKEN_FILE: /run/secrets/swarm_worker_token
      SWARM_MANAGER_TOKEN_FILE: /run/secrets/swarm_manager_token
      SWARMY_MESH_SERVICE_TOKEN_FILE: /run/secrets/mesh_service_token
      # JSON {authSecret, encryptionKey, ownerEmail, ownerPassword}; read by the
      # bootstrap seed only (sealed into swarm-kv), never exported to the env.
      SWARMY_MESH_CONTROL_FILE: /run/secrets/mesh_control
      # Controller store (resilience P3): the replica target and the boot
      # fallback bundle, read BEFORE the DB opens (controller-store/config.ts).
      SWARMY_CONTROL_STORE_FILE: /run/secrets/control_store
      # Who am I, for the raft lease (Swarm templates, resolved per task).
      SWARMY_TASK_ID: "{{.Task.ID}}"
      SWARMY_NODE_ID: "{{.Node.ID}}"
      SWARMY_NODE_HOSTNAME: "{{.Node.Hostname}}"
      SWARMY_SERVICE_NAME: "{{.Service.Name}}"
      # The lease as it stood when this task was created. Non-empty = a controller
      # ran before, so boot refuses to start empty (controller-store/restore-select.ts).
      SWARMY_LEASE_AT_START: '{{index .Service.Labels "swarmy.controller.lease"}}'
    secrets:
      - swarmy_secret_key
      - better_auth_secret
      - admin_password
      - bootstrap_join_token
      - swarm_worker_token
      - swarm_manager_token
      - mesh_service_token
      - mesh_control
      - source: control_store
        target: control_store
        mode: 0400
    volumes:
      - swarmy-data:/var/lib/swarmy
    ports:
      # Host-mode publish so first login works at http://<host-ip>:<port> before
      # ingress exists, and auth rate limits see the real client IP. It follows
      # the controller: once the controller floats, use the https dashboard (the
      # edge reaches swarmy_controller over swarmy-control wherever it runs)
      # rather than one node's IP.
      - target: 3021
        published: ${SWARMY_PUBLISH_PORT}
        protocol: tcp
        mode: host
    networks:
      # PRIVATE control-plane overlay only. Never the shared `swarmy` network:
      # every routed/observed app joins that one, and an app there could reach
      # (or alias-impersonate) the controller.
      - swarmy-control
      # Egress to in-swarm integrations (discovered AI engines, alert/webhook
      # targets). Only those services are attached to it; apps never are.
      - swarmy-integrations
    deploy:
      # The control plane is platform plumbing, not a user app stack.
      labels:
        swarmy.system: "true"
        # The raft lease (controller-store/lease.ts). `docker stack deploy` rewrites
        # service labels, so the installer carries the live value through; dropping
        # it would fence the running controller mid-upgrade.
        swarmy.controller.lease: '${SWARMY_CONTROLLER_LEASE:-}'
      replicas: 1
      placement:
        constraints:
          # `node.hostname == <bootstrap host>` until control.db is replicated,
          # `node.role == manager` after (the installer keeps whichever is live).
          # The volume stays node-local: a controller that lands on another
          # manager restores from the replica before the DB opens (controller-store/boot.ts).
          - ${SWARMY_CONTROLLER_PLACEMENT}
          # "Move controller to…" labels every other manager with this; Swarm's
          # constraint enforcer evicts the task and the scheduler places it on the target.
          - node.labels.swarmy.controller.avoid != true
      update_config:
        # stop-first: the old controller releases the raft lease (after its final
        # Litestream sync) before the new one starts. replicas: 1 never means two writers.
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
    # A clean stop: stop writes, let Litestream ship the tail (≤ 20 s), release the lease.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3021/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  # swarmy's PRIVATE control-plane overlay: the controller, ClickHouse, and the trusted bridges that must reach them
  # (edge Caddy's dashboard vhost, cloudflared, the OTel collector, the node-#1
  # agent). User services never join it — swarmy's admission refuses it, and
  # compose→stack rejects it. External + literally named so docker stack
  # doesn't prefix it. The installer creates it (encrypted; MTU sized for the
  # mesh when the swarm rides one) before deploying this file.
  #
  # The shared `swarmy` overlay (edge ↔ routed apps, OTel collector, Garage)
  # is deliberately NOT attached here.
  swarmy-control:
    external: true
    name: swarmy-control
  # The controller's way out to in-swarm integration targets. swarmy attaches
  # ONLY the services it must dial (discovered Ollama/vLLM, the in-swarm hosts
  # of alert channels and outbound webhooks); nothing of the control plane is
  # on it. The installer creates it.
  swarmy-integrations:
    external: true
    name: swarmy-integrations

volumes:
  swarmy-data:

secrets:
  swarmy_secret_key:
    external: true
  better_auth_secret:
    external: true
  admin_password:
    external: true
  bootstrap_join_token:
    external: true
  swarm_worker_token:
    external: true
  swarm_manager_token:
    external: true
  mesh_service_token:
    external: true
  mesh_control:
    external: true
  # `{}` until replication is on; then swarmy_control_store.<ts>. Secrets are
  # immutable, so the controller mints a new one and repoints the service.
  control_store:
    external: true
    name: ${SWARMY_CONTROL_STORE_SECRET}
