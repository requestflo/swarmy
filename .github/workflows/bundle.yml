name: Offline bundle

# The air-gapped install/upgrade bundle for a published release
# (plans/epic-platform-upgrades.md §1 "Offline bundles"): swarmy-<ver>.tar =
# the release's signed platform.json + .sig + every image it names as an OCI
# layout (scripts/platform-bundle.ts). Load it in Settings → Platform →
# Import release → The bundle (.tar).
#
# Manual, like the Release workflow: run it (Actions → Offline bundle → Run
# workflow) after Images has published the release's manifest to the feed.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release to bundle: a version (1.3.0 → GitHub release v1.3.0) or a channel (stable / edge → its rolling release)'
        required: true
        default: stable

# Images are pulled anonymously (swarmy's GHCR images are public, as the
# installer pulls them), by the digests the signed manifest names.
permissions:
  contents: write # attach the bundle to the release

jobs:
  bundle:
    name: swarmy offline bundle
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Every system image, every platform: several GB written twice (the OCI
      # layout, then the tar). The hosted runner's toolchains we don't use go.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - name: Download the release's signed manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$RELEASE" in
            stable|edge) tag="$RELEASE" ;;
            v*) tag="$RELEASE" ;;
            *) tag="v$RELEASE" ;;
          esac
          gh release download "$tag" --pattern platform.json --pattern platform.json.sig --clobber
          [ -s platform.json.sig ] || { echo "::error::$tag has no platform.json.sig; refusing to bundle an unsigned release."; exit 1; }
          version="$(jq -r .version platform.json)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Bundling swarmy $version ($(jq -r .channel platform.json)) from release $tag"
      # Verifies the signature against the built-in release key first, then
      # exports every component by digest (regctl, digest-preserving).
      - name: Build the bundle
        run: bun scripts/platform-bundle.ts platform.json platform.json.sig "swarmy-${VERSION}.tar"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          f="swarmy-${VERSION}.tar"
          sha256sum "$f" > "$f.sha256"
          size="$(stat -c %s "$f")"
          echo "$f: $((size / 1000000)) MB"
          # GitHub caps a release asset at 2 GiB: a bigger bundle goes up in
          # parts (cat swarmy-<ver>.tar.part-* > swarmy-<ver>.tar to rejoin).
          if [ "$size" -lt 2000000000 ]; then
            gh release upload "$TAG" "$f" "$f.sha256" --clobber
          else
            split -b 1900m -d "$f" "$f.part-"
            gh release upload "$TAG" "$f".part-* "$f.sha256" --clobber
          fi
          {
            echo "### swarmy ${VERSION} offline bundle"
            echo "Attached to release \`${TAG}\` ($((size / 1000000)) MB, sha256 in \`$f.sha256\`)."
            echo "Load it in Settings → Platform → Import release → The bundle (.tar)."
          } >> "$GITHUB_STEP_SUMMARY"
