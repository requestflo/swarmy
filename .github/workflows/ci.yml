name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHECKPOINT_DISABLE: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  verify:
    name: typecheck · build · schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:generate
      # Controllers build control.db and telemetry.db from prisma/migrations on
      # boot (ensureSchema). Apply every migration through that same path to a
      # fresh file, then fail if the result differs from the schema: a model
      # change without a migration would ship a controller missing tables.
      - name: Migrations apply and match the schema
        run: bun run --cwd packages/db db:check
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

  sdks:
    name: SDKs (generated models · python · go · ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:generate
      # openapi.json and the SDK models are committed: regenerating must be a
      # no-op, or a route/DTO change shipped without its contract.
      - name: Contract and models are up to date
        run: |
          bun run openapi:dump
          bun run gen:sdks
          git diff --exit-code -- packages/api-rest/openapi.json sdks/typescript/src/models.ts sdks/python/swarmy/models.py sdks/go/models.go
      # A keyword field name once made `import swarmy` a SyntaxError.
      - name: Python SDK imports and passes its tests
        working-directory: sdks/python
        run: |
          python -m pip install --quiet '.[test]'
          cd / && python -c "import swarmy" && cd -
          python -m pytest -q
      - name: Go SDK
        working-directory: sdks/go
        run: |
          go vet ./...
          go test ./...
      - name: TypeScript SDK
        working-directory: sdks/typescript
        run: bun test

  images-dryrun:
    name: ${{ matrix.name }} image (build, no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: controller
            dockerfile: apps/api/Dockerfile
          - name: agent
            dockerfile: apps/agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build (amd64 only for speed) without pushing to catch Dockerfile breakage
      # before it reaches main / the release + images workflows.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          build-args: |
            SWARMY_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Lint PR commits
        run: bunx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
