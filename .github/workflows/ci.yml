name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHECKPOINT_DISABLE: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'
  DATABASE_URL: postgresql://swarmy:swarmy@localhost:5432/swarmy

jobs:
  verify:
    name: typecheck · build · schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swarmy
          POSTGRES_PASSWORD: swarmy
          POSTGRES_DB: swarmy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarmy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:generate
      - name: Validate schema applies
        run: bun --filter @swarmy/db exec prisma db push --skip-generate --accept-data-loss
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Lint PR commits
        run: bunx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
