name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHECKPOINT_DISABLE: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'
  DATABASE_URL: postgresql://swarmy:swarmy@localhost:5432/swarmy

jobs:
  verify:
    name: typecheck · build · schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swarmy
          POSTGRES_PASSWORD: swarmy
          POSTGRES_DB: swarmy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarmy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:generate
      # Installs build their schema from prisma/migrations (lite: ensureSchema,
      # standard: migrate deploy) — never from db push. Apply the real
      # migrations, then fail if the schema still differs: a model change
      # without a migration would otherwise ship a controller missing tables.
      - name: Migrations apply and match the schema
        working-directory: packages/db
        run: |
          bunx prisma migrate deploy
          bunx prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code \
            || { echo "::error::prisma/schema has changes with no migration — run: bunx prisma migrate diff --from-config-datasource --to-schema prisma/schema --script > prisma/migrations/<next>/migration.sql"; exit 1; }
      # Standard-tier controllers migrate on boot via ensureSchema over the pg
      # adapter — a different executor from prisma's. Prove it on real Postgres.
      - name: Boot-time schema path applies on Postgres
        run: |
          PGPASSWORD=swarmy psql -h localhost -U swarmy -d swarmy -c 'CREATE DATABASE swarmy_boot'
          ENSURE_SCHEMA_URL=postgresql://swarmy:swarmy@localhost:5432/swarmy_boot bun packages/db/scripts/check-ensure-schema.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

  images-dryrun:
    name: ${{ matrix.name }} image (build, no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: controller
            dockerfile: apps/api/Dockerfile
          - name: agent
            dockerfile: apps/agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build (amd64 only for speed) without pushing to catch Dockerfile breakage
      # before it reaches main / the release + images workflows.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          build-args: |
            SWARMY_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Lint PR commits
        run: bunx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
