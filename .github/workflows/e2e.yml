name: E2E

# The headline self-host gate (testing-conventions inv. 6): build the controller +
# agent images from this checkout, run the REAL installer on a fresh runner, and
# prove install → node ONLINE → deploy → reachable over HTTPS ingress, plus the
# regressions caught in live testing. See scripts/e2e-smoke.sh for the checks.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-host:
    name: self-host (${{ matrix.tier }}) install → online → deploy → reachable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # lite = embedded PGlite; standard = Postgres service. They migrate
        # through different executors, so each tier gets its own full run.
        tier: [lite, standard]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: swarmy-controller:e2e
          build-args: |
            SWARMY_COMMIT=${{ github.sha }}
          cache-from: |
            type=gha,scope=e2e-controller
            type=gha
          cache-to: type=gha,scope=e2e-controller,mode=max

      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: swarmy-agent:e2e
          build-args: |
            SWARMY_COMMIT=${{ github.sha }}
          cache-from: |
            type=gha,scope=e2e-agent
            type=gha
          cache-to: type=gha,scope=e2e-agent,mode=max

      - name: Install swarmy (real installer, from the checkout)
        timeout-minutes: 8
        run: |
          sudo bash scripts/install-swarmy.sh \
            --non-interactive \
            ${{ matrix.tier == 'standard' && '--standard' || '' }} \
            --admin-email e2e@example.com \
            --image swarmy-controller:e2e \
            --agent-image swarmy-agent:e2e

      # A no-flag re-run must keep the tier and settings (upgrade path).
      - name: Re-run installer (upgrade path)
        timeout-minutes: 8
        run: sudo bash scripts/install-swarmy.sh --non-interactive

      - name: E2E smoke
        timeout-minutes: 20
        env:
          SWARMY_E2E_URL: http://127.0.0.1:3021
          SWARMY_E2E_EMAIL: e2e@example.com
        run: bash scripts/e2e-smoke.sh

      - name: Diagnostics (installer/stack failed before the smoke ran)
        if: failure()
        run: |
          docker service ls || true
          docker service ps --no-trunc $(docker service ls -q) || true
          docker service logs --no-trunc --tail 300 swarmy_controller || true
          docker logs --tail 200 swarmy-agent || true
