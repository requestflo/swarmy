# Local backing services for swarmy development.
#   bun docker:up    -> start postgres
#   bun docker:up --profile ingress  -> also start caddy + traefik for ingress testing
#
# Host port for Postgres defaults to 5678. If 5678 is taken locally (e.g. another
# project's Postgres), set SWARMY_DB_PORT in your root .env to a free port and
# point DATABASE_URL at the same port. Compose reads .env from the repo root.
name: swarmy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: swarmy
      POSTGRES_PASSWORD: swarmy
      POSTGRES_DB: swarmy
    ports:
      - '${SWARMY_DB_PORT:-5678}:5432'
    volumes:
      - swarmy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swarmy -d swarmy']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: a local Caddy to exercise the caddy ingress driver.
  #
  # Admin API: the mounted Caddyfile binds the admin endpoint with `admin :2019`
  # (all container interfaces == 0.0.0.0:2019), and 2019 is published to the host
  # below — so the agent's
  # `applyIngress` admin-API path (POST the rendered Caddyfile to `/load`) reaches it
  # at http://127.0.0.1:2019 in single-node dev. To drive Caddy via the admin API in
  # dev, set the org ingress config's globalOptions.extraConfig to:
  #   { "applyVia": "admin", "adminUrl": "http://127.0.0.1:2019/load" }
  # On a real swarm the controller (ensureCaddyController → service swarmy-ingress-caddy)
  # serves the admin API on the overlay; leave adminUrl unset to target the service name.
  # Verify a pushed route:  curl -s http://127.0.0.1:2019/config/ | jq .
  caddy:
    image: caddy:2-alpine
    profiles: ['ingress']
    restart: unless-stopped
    ports:
      - '8080:80'
      - '8443:443'
      - '2019:2019' # admin API (bound 0.0.0.0:2019 in ./caddy/Caddyfile so the host mapping reaches it)
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - swarmy-caddy-data:/data
      - swarmy-caddy-config:/config

  # Optional: a local Traefik to exercise the traefik ingress driver.
  traefik:
    image: traefik:v3.3
    profiles: ['ingress']
    restart: unless-stopped
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
    ports:
      - '8081:80'
      - '8444:443'
      - '8090:8080' # dashboard
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./traefik/dynamic:/etc/traefik/dynamic

volumes:
  swarmy-pgdata:
  swarmy-caddy-data:
  swarmy-caddy-config:
