[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmy"
version = "0.1.0"
description = "Official Python client for the swarmy public REST API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "swarmy" }]
# Zero runtime dependencies — stdlib urllib only.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["swarmy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
